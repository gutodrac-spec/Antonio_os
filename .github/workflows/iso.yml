name: ISO
on:
  workflow_dispatch:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths: ["flake.nix", "flake.lock", "nix/**", "agentd/**", "sidebar/**", ".github/workflows/iso.yml"]
jobs:
  iso:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Liberar espaço em disco
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
      - uses: DeterminateSystems/nix-installer-action@v16
      - name: Gerar a ISO
        run: |
          nix build -L .#iso
          cp result/iso/antonio-os.iso .
          sha256sum antonio-os.iso | tee antonio-os.iso.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: antonio-os-iso
          path: |
            antonio-os.iso
            antonio-os.iso.sha256
          compression-level: 0
          retention-days: 30
